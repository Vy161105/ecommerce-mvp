      POSTGRES_DB: ${PRODUCT_POSTGRES_DB:-product_db}
    ports:
      - "${PRODUCT_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_product_data:/var/lib/postgresql/data
      - ./services/product-service/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PRODUCT_POSTGRES_USER:-postgres} -d ${PRODUCT_POSTGRES_DB:-product_db}"
        ]
      interval: 5s
